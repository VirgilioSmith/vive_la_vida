name: Beneficios — registrar anualidad y seguros en cabecera
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/beneficios-anualidad-hero.yml'
permissions:
  contents: write
jobs:
  publicar-tras-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Incorporar acción de anualidad a la cabecera actual
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app.js')
          s=p.read_text()
          old="""  const mainBtn=cards.length?`<button type="button" class="btn light" data-v144-action="new-cashback" data-id="${sanitize(cards[0].id)}">${icon('plus')} Registrar beneficio</button>`:action('Añadir tarjeta','addCard');"""
          new="""  const annualAction=!cards.length?'':cards.length===1
             ?`<button type="button" class="btn light" data-act="annualFee" data-id="${sanitize(cards[0].id)}">${icon('receipt')} Registrar anualidad y seguros</button>`
             :`<details class="v180-annual-picker"><summary class="btn light">${icon('receipt')} Registrar anualidad y seguros</summary><div class="v180-annual-list" aria-label="Selecciona una tarjeta">${cards.map(c=>`<button type="button" data-act="annualFee" data-id="${sanitize(c.id)}">${sanitize(c.name)} ${c.last4?'· •••• '+sanitize(c.last4):''}</button>`).join('')}</div></details>`;
            const mainBtn=cards.length?`<button type="button" class="btn light" data-v144-action="new-cashback" data-id="${sanitize(cards[0].id)}">${icon('plus')} Registrar beneficio</button>`+annualAction:action('Añadir tarjeta','addCard');"""
          assert s.count(old)==1,s.count(old)
          p.write_text(s.replace(old,new,1))
          css=Path('src/styles.css')
          css.write_text(css.read_text()+"""
          /* Beneficios: registrar anualidad y seguros desde la misma cabecera del resultado anual. */
          .v57-benefits .hero-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
          .v57-benefits .v180-annual-picker{position:relative;z-index:15}
          .v57-benefits .v180-annual-picker>summary{display:inline-flex;align-items:center;gap:8px;cursor:pointer;list-style:none}
          .v57-benefits .v180-annual-picker>summary::-webkit-details-marker{display:none}
          .v57-benefits .v180-annual-list{position:absolute;left:0;top:calc(100% + 8px);min-width:min(310px,85vw);max-height:260px;overflow-y:auto;padding:6px;border-radius:15px;border:1px solid #d9e9e6;background:#fff;box-shadow:0 14px 36px #071d2240;z-index:25}
          .v57-benefits .v180-annual-list>button{display:block;width:100%;padding:11px 12px;text-align:left;white-space:normal;cursor:pointer;border:0;border-radius:10px;background:transparent;color:#102e33;font:inherit;font-size:13px}
          .v57-benefits .v180-annual-list>button:hover,.v57-benefits .v180-annual-list>button:focus-visible{background:#e7f5f1}
          """)
          index=Path('index.html')
          t=index.read_text()
          for x,y in [('src/styles.css?v=533','src/styles.css?v=534'),('src/app.js?v=397','src/app.js?v=398')]:
            assert t.count(x)==1,x
            t=t.replace(x,y,1)
          index.write_text(t)
          PY
          node --check src/app.js
          git diff --check
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Instalar Chromium
        run: |
          npm i --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Probar registro de anualidad y seguros con Playwright
        run: |
          node <<'NODE'
          const {chromium}=require('playwright'),assert=require('node:assert/strict'),open=require('./tests/harness');
          (async()=>{
            const b=await chromium.launch();
            try{
              const {p,ctx}=await open(b,1440,900);
              try{
                await p.evaluate(()=>window.__T.go('benefits'));
                await p.locator('.v57-benefits .hero-actions').waitFor();
                const hero=p.locator('.v57-benefits .hero-actions');
                assert.equal(await hero.getByText('Registrar beneficio').count(),1);
                const pick=hero.locator('.v180-annual-picker');
                const direct=hero.getByRole('button',{name:'Registrar anualidad y seguros'});
                if(await pick.count()){
                  await pick.locator('summary').click();
                  const entries=pick.locator('[data-act="annualFee"]');
                  assert.ok(await entries.count()>0,'Selector de tarjetas');
                  await entries.first().click();
                }else{
                  assert.equal(await direct.count(),1);
                  await direct.click();
                }
                await p.getByText('Anualidad', {exact:true}).first().waitFor({timeout:8000});
                console.log('OK anualidad desde resultado anual');
              }finally{await ctx.close()}
            }finally{await b.close()}
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Commit directo en main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js src/styles.css index.html
          git commit -m "fix(beneficios): agregar anualidad y seguros al resultado anual"
          git push origin HEAD:main
