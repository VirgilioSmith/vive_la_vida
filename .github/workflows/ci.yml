name: pruebas
on:
  pull_request:
  push:
    branches: [main]
jobs:
  navegador-y-logica:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Instalar Playwright y Chromium
        run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - name: Lógica y Edge Functions (sin navegador)
        run: |
          node --test supabase/tests/ingest.test.mjs supabase/tests/link.test.mjs supabase/tests/shortcuts.test.mjs
          node --test tests/logica/reglas.test.js tests/logica/red.test.js
      - name: Navegador
        run: |
          node tests/smoke.js
          node tests/csp.js
          node tests/xss.js
          node tests/adversarial.js
          node tests/remediacion-03.js
          node tests/experiencia-04.js
          node tests/rendimiento.js
          node tests/vive-score.js
          node tests/flujos-ingresos.js
          node tests/logica/run.js
      - name: Capturas de auditoría móvil
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vive-mobile-playwright
          path: test-results/vive-mobile/
          if-no-files-found: ignore
  auditoria-vive-movil:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Preparar Playwright y Chromium
        run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - name: Auditoría de categorías y movimientos móviles
        run: node tests/vive-mobile-auditoria.js
      - name: Capturas de auditoría móvil
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vive-mobile-playwright
          path: test-results/vive-mobile/
          if-no-files-found: ignore
  movimientos-movil:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps ${{ matrix.browser }}
      - run: node tests/movimientos-mobile.js
        env:
          MOVEMENTS_BROWSER: ${{ matrix.browser }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vive-movimientos-${{ matrix.browser }}
          path: test-results/movimientos/
          if-no-files-found: ignore
  conciliacion-saldos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Preparar Playwright y Chromium
        run: npm i --no-save playwright@1 && npx playwright install --with-deps ${{ matrix.browser }}
      - name: Auditar conciliación de cuentas
        run: node tests/conciliacion-saldos.js
        env:
          RECONCILIATION_BROWSER: ${{ matrix.browser }}
      - name: Capturas y resultados de conciliación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vive-conciliacion-saldos-${{ matrix.browser }}
          path: test-results/conciliacion/
          if-no-files-found: ignore
  wallet-credit-global:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps ${{ matrix.browser }}
      - run: node tests/wallet-credit-global.js
        env:
          WALLET_BROWSER: ${{ matrix.browser }}
      - name: Verificar encabezado compacto de Inicio móvil
        run: node tests/home-mobile-header.js
        env:
          HOME_BROWSER: ${{ matrix.browser }}
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Postgres local
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -q -f supabase/tests/reglas_vigentes.sql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -q -f supabase/tests/finance_apply_changes.sql

  teclado-numerico-movil:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Instalar navegador y Playwright
        run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - name: Playwright visible en pantalla virtual y grabación de trazas
        run: xvfb-run -a env PW_VISIBLE=1 node tests/native-numeric-input.js
      - name: Evidencias interactivas Playwright Trace Viewer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vive-teclado-numerico-playwright
          path: test-results/native-numeric-input/
          if-no-files-found: ignore

  anualidad-seguros-movil:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Instalar Playwright y navegador
        run: npm i --no-save playwright@1 && npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verificar anualidad y seguros en móvil
        run: node tests/anualidad-seguros-mobile.js
        env:
          ANNUAL_BROWSER: ${{ matrix.browser }}
      - name: Evidencia visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vive-anualidad-seguros-${{ matrix.browser }}
          path: test-results/anualidad-seguros/
          if-no-files-found: ignore
