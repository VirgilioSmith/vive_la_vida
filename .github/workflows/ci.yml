name: pruebas
on:
  pull_request:
  push:
    branches: [main]
jobs:
  navegador-y-logica:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Instalar Playwright y Chromium
        run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - name: Lógica y Edge Functions (sin navegador)
        run: |
          node --test supabase/tests/ingest.test.mjs supabase/tests/link.test.mjs supabase/tests/shortcuts.test.mjs
          node --test tests/logica/reglas.test.js tests/logica/red.test.js
          node tests/wrapped-unit.js
      - name: Navegador
        run: |
          node tests/smoke.js
          node tests/movimientos-desktop-visual.js
          node tests/csp.js
          node tests/xss.js
          node tests/adversarial.js
          node tests/remediacion-03.js
          node tests/experiencia-04.js
          node tests/rendimiento.js
          node tests/vive-score.js
          node tests/flujos-ingresos.js
          node tests/logica/run.js
          node tests/sincronizacion-v1.js
          node tests/liquid-glass.js
          node tests/intelligence-linea.js
          node tests/intelligence-profundidad-original.js
          node tests/bancos-patrimonio.js
      - name: Evidencias Playwright de Movimientos PC
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vive-movimientos-desktop
          path: test-results/movimientos-desktop/
          if-no-files-found: ignore
      - name: Capturas de auditoría móvil
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vive-mobile-playwright
          path: test-results/vive-mobile/
          if-no-files-found: ignore
  auditoria-vive-movil:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Preparar Playwright y Chromium
        run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - name: Auditoría de categorías y movimientos móviles
        run: node tests/vive-mobile-auditoria.js
      - name: Capturas de auditoría móvil
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vive-mobile-playwright
          path: test-results/vive-mobile/
          if-no-files-found: ignore
  movimientos-movil:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps ${{ matrix.browser }}
      - run: node tests/movimientos-mobile.js
        env:
          MOVEMENTS_BROWSER: ${{ matrix.browser }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vive-movimientos-${{ matrix.browser }}
          path: test-results/movimientos/
          if-no-files-found: ignore
  conciliacion-saldos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Preparar Playwright y Chromium
        run: npm i --no-save playwright@1 && npx playwright install --with-deps ${{ matrix.browser }}
      - name: Auditar conciliación de cuentas
        run: node tests/conciliacion-saldos.js
        env:
          RECONCILIATION_BROWSER: ${{ matrix.browser }}
      - name: Capturas y resultados de conciliación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vive-conciliacion-saldos-${{ matrix.browser }}
          path: test-results/conciliacion/
          if-no-files-found: ignore
  arranque:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps ${{ matrix.browser }}
      - name: Arranque con sesión, restos antiguos, Supabase caído y animaciones congeladas
        run: node tests/arranque.js
        env:
          ARRANQUE_BROWSER: ${{ matrix.browser }}
      - name: VIVE Wrapped móvil y PC
        run: |
          node tests/wrapped-browser.js
          node tests/time-machine.js
          node tests/wrapped-originals.js
        env:
          WRAPPED_BROWSER: ${{ matrix.browser }}
  wallet-credit-global:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps ${{ matrix.browser }}
      - run: node tests/wallet-credit-global.js
        env:
          WALLET_BROWSER: ${{ matrix.browser }}
          WALLET_VISUAL_DIR: test-results/wallet-consumption
      - name: Verificar matemáticas de consumo histórico y mensual
        run: node --test tests/logica/wallet-consumo.test.js
      - name: Verificar encabezado compacto de Inicio móvil
        run: node tests/home-mobile-header.js
        env:
          HOME_BROWSER: ${{ matrix.browser }}
          HOME_VISUAL_DIR: test-results/wallet-consumption
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wallet-consumption-${{ matrix.browser }}
          path: test-results/wallet-consumption
  wallet-mobile-fidelity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Preparar Playwright
        run: npm i --no-save playwright@1 && npx playwright install --with-deps ${{ matrix.browser }}
      - name: Auditar Wallet móvil a 320, 375, 390 y 430 px (Claro y Black)
        run: node tests/wallet-mobile-fidelity.js
        env:
          WALLET_BROWSER: ${{ matrix.browser }}
      - name: Subir capturas y resultados aunque fallen pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallet-mobile-fidelity-${{ matrix.browser }}
          path: test-results/wallet-mobile-fidelity/
          if-no-files-found: warn
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Postgres local
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -q -f supabase/tests/reglas_vigentes.sql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -q -f supabase/tests/finance_apply_changes.sql

  teclado-numerico-movil:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Instalar navegador y Playwright
        run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - name: Playwright visible en pantalla virtual y grabación de trazas
        run: xvfb-run -a env PW_VISIBLE=1 node tests/native-numeric-input.js
      - name: Evidencias interactivas Playwright Trace Viewer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vive-teclado-numerico-playwright
          path: test-results/native-numeric-input/
          if-no-files-found: ignore
