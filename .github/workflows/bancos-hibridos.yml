name: Bancos híbridos — Playwright PC y móvil

on:
  push:
    branches: [main]
    paths:
      - 'src/app.js'
      - 'src/banks-desktop.css'
      - 'index.html'
      - 'tests/bancos-patrimonio.js'
      - '.github/workflows/bancos-hibridos.yml'
  workflow_dispatch:

jobs:
  bancos-pc-y-movil:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener proyecto e historial para comparación visual
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recuperar referencia móvil anterior a la unificación
        run: |
          mkdir -p /tmp/vive-bancos-previo
          git archive 27d500767a5c index.html src assets vendor manifest.webmanifest | tar -xf - -C /tmp/vive-bancos-previo
      - name: Guardar la referencia histórica
        uses: actions/upload-artifact@v4
        with:
          name: bancos-movil-original-27d5007
          path: /tmp/vive-bancos-previo/
          if-no-files-found: error
      - name: Snapshot de fuentes para reparación visual controlada
        uses: actions/upload-artifact@v4
        with:
          name: bancos-src-snapshot
          path: |
            src/
            tests/
            index.html
            vendor/
            assets/
            manifest.webmanifest
          if-no-files-found: error
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar Playwright y Chromium
        run: |
          npm i --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Validar Bancos PC y móvil web
        run: node tests/bancos-patrimonio.js
        env:
          BANKS_VISUAL_DIR: test-results/bancos-hibridos
      - name: Guardar evidencias de escritorio, móvil y referencia previa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bancos-hibridos-playwright
          path: test-results/bancos-hibridos/
          if-no-files-found: ignore
