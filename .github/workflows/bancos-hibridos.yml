name: Bancos híbridos — Playwright PC y móvil

on:
  push:
    branches: [main]
    paths:
      - 'src/app.js'
      - 'src/banks-desktop.css'
      - 'index.html'
      - 'tests/bancos-patrimonio.js'
      - '.github/workflows/bancos-hibridos.yml'
  workflow_dispatch:

jobs:
  bancos-pc-y-movil:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener proyecto e historial para comparación visual
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exportar código de prueba para validación visual local
        uses: actions/upload-artifact@v4
        with:
          name: vive-bancos-fuentes
          path: |
            src/
            tests/
            index.html
            vendor/
            assets/
            manifest.webmanifest
          if-no-files-found: error
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar Playwright y Chromium
        run: |
          npm i --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Diagnóstico de estructura Bancos y Wallet (sin datos privados)
        run: |
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('src/app.js','utf8');
          const terms=['vBanksPc-world','vBanksPc-grid','vBanksPc-bank-list','Tus instituciones','Tu posición bancaria','Productos y movimientos','banksPcProducts','vBanks-mobile-head','vBanksPc-benefits','Tu universo financiero','Tu posición financiera'];
          for(const t of terms) {
            let p=-1,n=0;
            while((p=s.indexOf(t,p+1))!==-1 && n++<2) {
              console.log('\\n=== '+t+' ('+p+') ===\\n'+s.slice(Math.max(0,p-800),Math.min(s.length,p+1500)));
            }
          }
          NODE
      - name: Validar Bancos PC y móvil web
        run: node tests/bancos-patrimonio.js
        env:
          BANKS_VISUAL_DIR: test-results/bancos-hibridos
      - name: Guardar evidencias de escritorio, móvil y referencia previa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bancos-hibridos-playwright
          path: test-results/bancos-hibridos/
          if-no-files-found: ignore
