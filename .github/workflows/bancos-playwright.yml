name: Bancos Playwright
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/bancos-playwright.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/bancos-playwright.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bancos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Vive Joseo desktop and mobile
        run: node tests/vive-joseo.js
      - name: Bancos and Patrimonio regression
        if: always()
        run: CI= BANKS_VISUAL_DIR="$PWD/bancos-evidence" node tests/bancos-patrimonio.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bancos-playwright-capturas
          path: bancos-evidence/
          if-no-files-found: warn
