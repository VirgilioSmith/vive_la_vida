name: Aplicar rediseño Bancos PC (validado con Playwright)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/banks-layout.patch.gz.b64'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Aplicar exclusivamente el parche de Bancos
        run: |
          base64 -d scripts/banks-layout.patch.gz.b64 | gzip -d > /tmp/vive-bancos.patch
          git apply --check /tmp/vive-bancos.patch
          git apply /tmp/vive-bancos.patch
          node --check src/app.js
          git diff --check
          git diff --name-only
      - name: Preparar Node y Playwright
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar Chromium y Playwright
        run: |
          npm i --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Probar Bancos PC y móvil web
        run: node tests/bancos-patrimonio.js
        env:
          BANKS_VISUAL_DIR: test-results/bancos-hibridos-upgrade
      - name: Probar Wallet PC tras ajustes solicitados
        run: |
          node -e "(async()=>{const {chromium}=require('playwright');const b=await chromium.launch();try{await require('./tests/wallet-desktop')(b)}finally{await b.close()}})().catch(e=>{console.error(e);process.exitCode=1})"
      - name: Guardar evidencia de escritorio y móvil
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bancos-redisenio-pc-movil
          path: test-results/bancos-hibridos-upgrade/
          if-no-files-found: ignore
      - name: Publicar directamente en main solo si las pruebas pasan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js src/banks-desktop.css src/wallet-desktop.css tests/bancos-patrimonio.js
          git diff --cached --quiet && exit 0
          git commit -m "feat(bancos): centralizador PC compacto, títulos y navegación coherentes"
          git push origin HEAD:main
