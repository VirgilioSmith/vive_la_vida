name: Wallet PC — corregir colisiones y alineación vertical
on:
  push:
    branches: [main]
    paths: ['scripts/wallet-visual-spacing.json']
permissions: {contents: write}
concurrency:
  group: wallet-visual-spacing
  cancel-in-progress: false
jobs:
  pruebas-y-publicacion:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Aplicar únicamente refinamientos visuales focalizados
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess
          edits=json.loads(pathlib.Path('scripts/wallet-visual-spacing.json').read_text())
          expected={'src/app.js','src/wallet-desktop.css','src/banks-desktop.css','index.html'}
          assert set(edits)==expected
          for name,steps in edits.items():
            p=pathlib.Path(name);s=p.read_text()
            for change in steps.get('replace',[]):
              old,new=change['old'],change['new']
              assert s.count(old)==1,(name,old[:80],s.count(old))
              s=s.replace(old,new,1)
            s+=steps.get('append','')
            p.write_text(s)
          names=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert names==expected,names
          PY
          node --check src/app.js
          git diff --check
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Instalar Playwright
        run: |
          npm i --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Probar Wallet funcional existente
        run: node -e "(async()=>{const {chromium}=require('playwright');const b=await chromium.launch();try{await require('./tests/wallet-desktop')(b)}finally{await b.close()}})().catch(e=>{console.error(e);process.exitCode=1})"
      - name: Verificar geometría Wallet y Bancos en PC
        run: |
          mkdir -p test-results/wallet-visual-spacing
          node <<'NODE'
          const assert=require('node:assert/strict'),{chromium}=require('playwright'),open=require('./tests/harness');
          (async()=>{
            const b=await chromium.launch();
            try{
              for(const [w,h] of [[1672,941],[1440,900],[1280,800],[1024,768]]){
                const {p,ctx}=await open(b,w,h);
                try{
                  await p.evaluate(()=>window.__T.go('wallet'));
                  await p.locator('.vWalletPc-return').waitFor();
                  await p.evaluate(()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r))));
                  const geom=await p.evaluate(()=>{
                    const main=document.querySelector('main.vWalletPc-world');
                    const item=sel=>[...main.querySelectorAll(sel)].map(el=>{
                      const r=el.getBoundingClientRect(),st=getComputedStyle(el);
                      return {text:el.textContent.trim(),x:r.x,y:r.y,w:r.width,h:r.height,scroll:el.scrollWidth,client:el.clientWidth,font:parseFloat(st.fontSize)};
                    });
                    return {tiles:item('.vWalletPc-return .v371-return-tile strong'),stats:item('.vWalletPc-stat strong'),right:item('.vWalletPc-right > *'),top:item('.vWalletPc-stats'),global:document.documentElement.scrollWidth-innerWidth};
                  });
                  assert.equal(geom.tiles.length,4);
                  for(let i=0;i<geom.tiles.length;i++){
                    const a=geom.tiles[i];
                    assert.ok(a.scroll<=a.client+3,'Importe retorno desbordado '+w+' '+JSON.stringify(a));
                    for(let k=0;k<i;k++){
                      const z=geom.tiles[k];
                      const overlap=a.x<z.x+z.w-2&&a.x+a.w>z.x+2&&a.y<z.y+z.h-2&&a.y+a.h>z.y+2;
                      assert.equal(overlap,false,'Colisión retorno '+w+' · '+JSON.stringify({a,z}));
                    }
                  }
                  assert.ok(geom.global<=2,'Desborde documento '+w);
                  assert.ok(geom.tiles.every(v=>v.font>=10),'Valores de retorno legibles '+w);
                  assert.ok(geom.right[1].y>geom.right[0].y+geom.right[0].h,'Espacio retorno-cortes '+w);
                  if(w>1120)assert.ok(geom.right[2].y>geom.right[1].y+geom.right[1].h,'Espacio cortes-consumo '+w);
                  await p.screenshot({path:'test-results/wallet-visual-spacing/wallet-'+w+'.png',fullPage:true,animations:'disabled'});
                  await p.evaluate(()=>window.__T.go('banks'));
                  await p.locator('.vBanksPc-metrics').waitFor();
                  const bank=await p.evaluate(()=>({top:document.querySelector('.vBanksPc-metrics').getBoundingClientRect().top,scroll:document.documentElement.scrollWidth-innerWidth}));
                  assert.ok(bank.scroll<=2,'Overflow Bancos '+w);
                  await p.screenshot({path:'test-results/wallet-visual-spacing/bancos-'+w+'.png',fullPage:true,animations:'disabled'});
                }finally{await ctx.close()}
              }
            }finally{await b.close()}
            console.log('Wallet y Bancos PC: márgenes, retorno sin colisiones y navegación confirmados');
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallet-visual-spacing
          path: test-results/wallet-visual-spacing/
          if-no-files-found: ignore
      - name: Commit a main sólo con tests aprobados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js src/wallet-desktop.css src/banks-desktop.css index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix(wallet-pc): separar retorno y alinear paneles con Bancos"
          git push origin HEAD:main
