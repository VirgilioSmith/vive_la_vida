name: Selector visual de conciliación
on:
  pull_request:
    paths:
      - src/app.js
      - tests/conciliar-selector-visual.js
      - .github/workflows/conciliar-selector-visual.yml
jobs:
  selector:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run -a node tests/conciliar-selector-visual.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conciliar-selector-visual
          path: test-results/conciliar-selector/
