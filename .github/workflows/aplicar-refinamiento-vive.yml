name: Aplicar refinamiento Vive (Bancos, Wallet PC y Resumen)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/refinamiento-vive.patch.gz.b64'
      - '.github/workflows/aplicar-refinamiento-vive.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refinamiento-vive-main
  cancel-in-progress: false
jobs:
  verificar-y-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Preparar parche limitado a las cuatro interfaces existentes
        run: |
          python3 - <<'PY'
          import base64,gzip
          from pathlib import Path
          source=Path('scripts/refinamiento-vive.patch.gz.b64').read_text().strip()
          def unpack(s):
              return gzip.decompress(base64.b64decode(s,validate=True))
          try: data=unpack(source)
          except Exception:
              # One-character transcription error: accept only a CRC-validated gzip reconstruction.
              options=[]
              for i in range(len(source)):
                  try: options.append(unpack(source[:i]+source[i+1:]))
                  except Exception: pass
              if not options or any(x!=options[0] for x in options): raise RuntimeError('Parche comprimido no íntegro')
              data=options[0]
          text=data.decode('utf-8')
          expected=['src/app.js','src/banks-desktop.css','src/wallet-desktop.css','index.html']
          paths=[line[6:].strip() for line in text.splitlines() if line.startswith('+++ b/')]
          assert paths==expected,(paths,expected)
          Path('/tmp/refinamiento-vive.patch').write_text(text)
          print('Parche validado:',len(data),'bytes')
          PY
          git apply --check /tmp/refinamiento-vive.patch
          git apply /tmp/refinamiento-vive.patch
          node --check src/app.js
          git diff --check
          git diff --name-only
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar Playwright Chromium
        run: |
          npm i --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Playwright Bancos PC, Bancos móvil y Patrimonio
        run: node tests/bancos-patrimonio.js
        env:
          BANKS_VISUAL_DIR: test-results/vive-refinamiento
      - name: Playwright Wallet PC — cálculos, retorno, navegación y movimientos
        run: |
          node -e "(async()=>{const {chromium}=require('playwright');const b=await chromium.launch();try{await require('./tests/wallet-desktop')(b)}finally{await b.close()}})().catch(e=>{console.error(e);process.exitCode=1})"
      - name: Verificar cambios visibles y ausencia de regresión móvil
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const {chromium}=require('playwright'),open=require('./tests/harness');
          (async()=>{
           const b=await chromium.launch();
           try {
            for(const w of [1672,1024,390]){
             const mobile=w<791;
             if(mobile)process.env.TOUCH='1';else delete process.env.TOUCH;
             const {ctx,p}=await open(b,w,mobile?844:941);
             try {
              await p.evaluate(()=>window.__T.go('banks'));
              assert.equal(await p.locator('.vBanksPc-bank[data-id="__all_banks__"]').count(),mobile?0:1);
              if(!mobile){
               assert.equal(await p.locator('.vBanksPc-metrics').isVisible(),true);
               assert.equal(await p.locator('.vBanksPc-metric').count(),4);
               const selectors=['.v371-card-return','.vBanks-certificates','.v1301-insight'];
               const boxes=await p.locator('.vBanksPc-insights').evaluate((el,s)=>s.map(x=>el.querySelector(x)?.getBoundingClientRect().top),selectors);
               assert.ok(boxes.every((n,i)=>Number.isFinite(n)&&(!i||n>boxes[i-1])),boxes);
               assert.equal(await p.locator('.rail-action[title="Patrimonio"]').count(),0);
              } else {
               assert.equal(await p.locator('.vBanks-mobile-selector').count(),1);
               assert.equal(await p.locator('.vBanks-mobile-tiles button').count(),4);
              }
              assert.ok(await p.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+2),'Sin overflow horizontal');
              await p.screenshot({path:'test-results/vive-refinamiento/resultado-bancos-'+w+'.png',fullPage:true,animations:'disabled'});
              if(!mobile){
               await p.evaluate(()=>window.__T.go('wallet'));
               const tiles=p.locator('.vWalletPc-return .v371-return-tile');
               assert.equal(await tiles.count(),4);
               assert.equal(await p.locator('.vWalletPc-recent').count(),1);
               assert.ok(await p.locator('.vWalletPc-recent-list button').count()<=3);
               await p.screenshot({path:'test-results/vive-refinamiento/resultado-wallet-'+w+'.png',fullPage:true,animations:'disabled'});
              }
              await p.evaluate(()=>window.__T.go('overview'));
              assert.equal(await p.locator('.rail-action[title="Patrimonio"]').count(),0);
              await p.evaluate(()=>window.__T.go('patrimony'));
              assert.equal(await p.locator('.rail-action[title="Resumen"][aria-current="page"]').count(),1);
             } finally {await ctx.close()}
            }
           } finally {await b.close()}
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Guardar capturas de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vive-refinamiento-visual
          path: test-results/vive-refinamiento/
          if-no-files-found: ignore
      - name: Commit directo en main solo si todo pasa
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js src/banks-desktop.css src/wallet-desktop.css index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat(vive): refinar bancos, retorno Wallet PC y navegación de Resumen"
          git push origin HEAD:main
