name: Wallet PC — importes completos y refinamiento visual
on:
  push:
    branches: [main]
    paths: ['scripts/wallet-pc-smart-fit.json']
permissions:
  contents: write
concurrency:
  group: wallet-pc-smart-fit
  cancel-in-progress: false
jobs:
  validar-y-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Aplicar cambios exclusivos de Wallet PC
        run: |
          python3 - <<'PY'
          import json,subprocess,pathlib
          edits=json.loads(pathlib.Path('scripts/wallet-pc-smart-fit.json').read_text())
          expected={'src/app.js','src/wallet-desktop.css','index.html'}
          assert set(edits)==expected
          for file,steps in edits.items():
              p=pathlib.Path(file);content=p.read_text()
              for s in steps.get('changes',[]):
                  assert content.count(s['old'])==1,(file,s['old'][:90],content.count(s['old']))
                  content=content.replace(s['old'],s['new'],1)
              content+=steps.get('append','')
              p.write_text(content)
          names=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert names==expected,names
          assert 'function vWalletPcFitMoney' in pathlib.Path('src/app.js').read_text()
          print('Alcance exclusivo Wallet PC:',sorted(names))
          PY
          node --check src/app.js
          git diff --check
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Instalar Playwright Chromium
        run: |
          npm i --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Playwright funcional Wallet PC existente
        run: |
          node -e "(async()=>{const {chromium}=require('playwright');const b=await chromium.launch();try{await require('./tests/wallet-desktop')(b)}finally{await b.close()}})().catch(e=>{console.error(e);process.exitCode=1})"
      - name: Playwright importes extremos, tarjetas y beneficio
        run: |
          mkdir -p test-results/wallet-smart-fit
          node <<'NODE'
          const assert=require('node:assert/strict');
          const {chromium}=require('playwright'),open=require('./tests/harness');
          (async()=>{
           const browser=await chromium.launch();
           try{
            for(const [width,height] of [[1672,941],[1440,900],[1280,800],[1024,768],[820,900]]){
             const {ctx,p}=await open(browser,width,height);
             try{
              await p.evaluate(()=>{
               const t=window.__T,d=t.dbg(),base=d.cards[0],date=t.fn.today();
               d.settings.fx=60;d.cards=[
                {...base,id:'wallet-stress-a',name:'Tarjeta Visa de prueba',last4:'1001',archived:false,limitDOP:123456789.67,limitUSD:1234567.89,openingDOP:0,openingUSD:0,annualFeeAmount:4500,annualFeeCurrency:'DOP'},
                {...base,id:'wallet-stress-b',name:'Mastercard USD',last4:'1002',archived:false,limitDOP:50000,limitUSD:9000,openingDOP:0,openingUSD:0,annualFeeAmount:1500,annualFeeCurrency:'DOP'}];
               d.statements=[];d.transactions=[
                ...Array.from({length:7},(_,i)=>({id:'stress-tx-'+i,cardId:'wallet-stress-a',type:'card_charge',currency:i%2?'USD':'DOP',amount:100+i,date,created:date+'T12:00:00Z',category:'Compras',merchant:'Comercio '+i})),
                {id:'stress-reward',cardId:'wallet-stress-a',type:'card_reward',currency:'DOP',amount:12000,date,created:date+'T12:00:00Z'}];
               t.inv();t.go('wallet');
              });
              await p.locator('.vWalletPc').waitFor();
              await p.evaluate(()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve))));
              assert.equal(await p.locator('.vWalletPc-recent').count(),0,'Créditos generales sin movimientos recientes');
              assert.equal(await p.locator('.vWalletPc-return .v371-return-tile').count(),4);
              assert.ok(await p.getByText('Todos tus créditos y sus beneficios, en un solo lugar.').count()>0);
              const moneyState=()=>p.evaluate(()=>{
               const root=document.querySelector('main.vWalletPc-world .vWalletPc');
               const sel='.vWalletPc-stat strong,.vWalletPc-stat small,.vWalletPc-limit > strong,.vWalletPc-limit-row > b,.vWalletPc-return .v371-return-tile strong,.vWalletPc-cuts button b,.vWalletPc-chart-total strong';
               const els=[...root.querySelectorAll(sel)];
               return els.map(el=>({text:el.textContent.trim(),width:el.clientWidth,scroll:el.scrollWidth,nowrap:getComputedStyle(el).whiteSpace==='nowrap',font:parseFloat(getComputedStyle(el).fontSize)}));
              });
              let values=await moneyState();
              for(const v of values)assert.ok(v.scroll<=v.width+4,'Importe desbordado '+width+': '+JSON.stringify(v));
              assert.ok(values.some(v=>/RD\$\d{1,3}(?:,\d{3}){2,}/.test(v.text)),'Montos grandes completos y sin abreviar');
              assert.ok(values.some(v=>v.text.includes('US$')),'Moneda original');
              assert.ok(await p.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+2));
              await p.screenshot({path:'test-results/wallet-smart-fit/wallet-global-'+width+'.png',animations:'disabled',fullPage:true});
              await p.getByRole('button',{name:'Seleccionar Tarjeta Visa de prueba'}).click();
              await p.locator('.vWalletPc-recent').waitFor();
              assert.equal(await p.locator('.vWalletPc-recent-list button').count(),5,'Hasta cinco movimientos por tarjeta individual');
              const returnButton=p.getByRole('button',{name:'Beneficios y retorno'});
              await returnButton.click();
              const pane=p.locator('main.vWalletPc-world .vWalletPc-benefit-actions');
              await pane.waitFor();
              assert.equal(await pane.getByRole('button',{name:'Registrar beneficio'}).count(),1);
              const annual=pane.getByRole('button',{name:'Registrar anualidad y seguros'});
              assert.equal(await annual.isEnabled(),true);
              assert.equal(await annual.getAttribute('data-id'),'wallet-stress-a');
              await p.getByRole('button',{name:'Volver a Wallet'}).click();
              await p.screenshot({path:'test-results/wallet-smart-fit/wallet-card-'+width+'.png',animations:'disabled',fullPage:true});
              assert.ok(await p.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+2));
             }finally{await ctx.close()}
            }
           }finally{await browser.close()}
           console.log('Wallet PC: cinco resoluciones; importes grandes en RD$/US$, selección, retorno y cinco movimientos aprobados');
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Playwright no-regresión de Bancos PC/móvil
        run: node tests/bancos-patrimonio.js
      - name: Guardar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallet-pc-importes-playwright
          path: test-results/wallet-smart-fit/
          if-no-files-found: ignore
      - name: Publicar en main solo con todas las pruebas aprobadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js src/wallet-desktop.css index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix(wallet-pc): importes completos, retorno compacto y actividad por tarjeta"
          git push origin HEAD:main
