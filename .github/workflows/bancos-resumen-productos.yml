name: Bancos PC — resumen ejecutivo de productos
on:
  push:
    branches: [main]
    paths:
      - 'scripts/bancos-resumen-productos.patch.gz.b64'
permissions:
  contents: write
concurrency:
  group: bancos-resumen-productos
  cancel-in-progress: false
jobs:
  validar-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Aplicar exclusivamente cambios de Bancos PC
        run: |
          base64 -d scripts/bancos-resumen-productos.patch.gz.b64 | gzip -d > /tmp/bancos-resumen-productos.patch
          git apply --check /tmp/bancos-resumen-productos.patch
          git apply /tmp/bancos-resumen-productos.patch
          node --check src/app.js
          node --check tests/bancos-patrimonio.js
          git diff --check
          python3 - <<'PY'
          import subprocess
          expected={'src/app.js','src/banks-desktop.css','tests/bancos-patrimonio.js','index.html'}
          got=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert got==expected,(got,expected)
          css=subprocess.check_output(['git','diff','--','src/banks-desktop.css'],text=True)
          assert '@media (min-width:791px)' in css and '@media (max-width:790px)' not in css
          print('Parche limitado a Bancos PC, sus pruebas y versiones de caché.')
          PY
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Instalar Playwright y Chromium
        run: |
          npm i --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Playwright Bancos PC y regresión Bancos móvil
        run: node tests/bancos-patrimonio.js
        env:
          BANKS_VISUAL_DIR: test-results/bancos-resumen-productos
      - name: Comprobar regresión de Wallet PC
        run: node -e "(async()=>{const {chromium}=require('playwright');const b=await chromium.launch();try{await require('./tests/wallet-desktop')(b)}finally{await b.close()}})().catch(e=>{console.error(e);process.exitCode=1})"
      - name: Evidencias de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bancos-pc-resumen-playwright
          path: test-results/bancos-resumen-productos/
          if-no-files-found: ignore
      - name: Commit directo a main tras validación
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js src/banks-desktop.css tests/bancos-patrimonio.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat(bancos): Productos como resumen ejecutivo de categorías"
          git push origin HEAD:main
