name: VIVE — Acentos y fondos dinámicos
on:
  push:
    branches: [main]
    paths:
      - 'src/dynamic-appearance.css'
      - 'tests/dynamic-appearance.js'
      - '.github/workflows/dynamic-appearance.yml'
  workflow_dispatch:
jobs:
  appearance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1
      - run: npx playwright install --with-deps chromium
      - run: node tests/dynamic-appearance.js
        env:
          APPEARANCE_VISUAL_DIR: test-results/appearance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dynamic-appearance-playwright
          path: test-results/appearance
