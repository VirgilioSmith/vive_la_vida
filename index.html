<script id="vive-v135-progressive-secondary" defer>
/* Progressive enhancement for SIMPLE secondary forms only.
   Moves optional original controls; keeps IDs, values, listeners, validation and existing saves. */
(function(){
 const OPTIONAL = new Set(['note','notes','tags','memo','alias','phone','email','comments','comment','observations','agreementTerms']);
 const EXCLUDED = new Set(['transactionForm','loanForm','v87LoanForm','v31EncryptedExportForm','v31EncryptedImportForm']);
 const FULL_ROW = new Set(['name','firstName','lastName','concept','accountId','cardId','institutionId','instrumentId','startDate','dueDate','category','subcategory']);
 function isOptionalLabel(label){
   const fields=[...label.querySelectorAll('input:not([type="hidden"]),select,textarea')];
   if(fields.length!==1)return false;
   const control=fields[0];
   return OPTIONAL.has(control.name)&& !control.required && !control.disabled && !label.closest('[data-flow-context]');
 }
 function process(form){
   if(form.dataset.v135Prepared==='yes'||EXCLUDED.has(form.id)||form.classList.contains('v134-progressive-form')||form.classList.contains('fastx-form')||form.classList.contains('studio-form')||form.classList.contains('v87-loan-wizard')||form.classList.contains('other-studio-form')||form.classList.contains('v48-wizard-mode'))return;
   const grid=form.querySelector(':scope > .form-grid');
   if(!grid)return;
   form.dataset.v135Prepared='yes';
   // Preserve complex embedded workflows; only adapt conventional simple forms.
   if(grid.querySelector('.flow-context,.flow-segment,.v87-wizard,.v48-wizard,.guided-form-v4,.smart-sub-wizard'))return;
   form.classList.add('v135-simple-form');
   const optional=[...grid.children].filter(el=>el.tagName==='LABEL'&&isOptionalLabel(el));
   if(optional.length){
      const fold=document.createElement('details');fold.className='v135-more';
      const summ=document.createElement('summary');summ.textContent='Más opciones';
      const body=document.createElement('div');body.className='v135-more-fields';
      let hasData=false;
      optional.forEach(el=>{
        const input=el.querySelector('input,select,textarea');
        if(input&&String(input.value||'').trim())hasData=true;
        body.appendChild(el);
      });
      fold.append(summ,body);
      if(hasData)fold.open=true;
      grid.appendChild(fold);
      form.addEventListener('invalid',ev=>{if(fold.contains(ev.target))fold.open=true},true);
   }
   // Two short related inputs may share a row on mobile; long selectors get the full width.
   [...grid.children].forEach(label=>{
     if(label.tagName!=='LABEL')return;
     const ctrl=label.querySelector('input,select,textarea');if(!ctrl)return;
     if(ctrl.matches('input[type="date"],input[type="number"]') && !FULL_ROW.has(ctrl.name) && ctrl.name!=='amount' && ctrl.name!=='principal')label.classList.add('v135-compact-field');
   });
 }
 function scan(){
   const root=document.getElementById('modal-root');if(!root)return;
   root.querySelectorAll('form').forEach(process);
 }
 function setup(){
   const root=document.getElementById('modal-root');if(!root)return;
   scan();
   const observer=new MutationObserver(scan);
   observer.observe(root,{subtree:true,childList:true});
   root.addEventListener('click',ev=>{
     // Editing a hidden optional field? Always make the native details visible.
     const target=ev.target.closest('.v135-more>summary');if(target)target.setAttribute('aria-label','Mostrar u ocultar opciones adicionales');
   });
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setup,{once:true});
 else setup();
})();
</script>

<script id="vive-v156-wallet-confirmation-engine">
/* V156: Feedback after a validated, booked transaction. Never mutates financial data.
   navigator.vibrate is optional and absent in Safari for iPhone; no fake haptic promise. */
(function(){
 let clear=null,leave=null;
 const symbols={
  income:'<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M16 32l11 11 22-23"/></svg>',
  expense:'<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M14 31l12 12 24-24"/></svg>',
  transfer:'<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M12 23h39m-11-10 11 10-11 10M52 42H13m11-10L13 42l11 10"/></svg>'
 };
 const classify=tx=>{
  const type=String(tx?.type||'');const flow=String(tx?.flowMode||'');
  if(['own','outgoing'].includes(flow)||['transfer','fx_transfer','bank_transfer'].includes(type))return 'transfer';
  if(['income'].includes(flow)||['income','bank_reward','card_reward'].includes(type))return 'income';
  if(['spend','service','cardpay'].includes(flow)||['expense','card_charge','card_payment','loan_payment'].includes(type))return 'expense';
  return null;
 };
 const label={income:'Ingreso registrado',expense:'Gasto registrado',transfer:'Transferencia registrada'};
 const prefix={income:'+',expense:'−',transfer:'↔'};
 const subtitle={income:'Importe añadido a tus movimientos',expense:'Movimiento contabilizado',transfer:'Movimiento entre cuentas contabilizado'};
 function feedback(tx){
  const kind=classify(tx);const value=Number(tx?.amount);if(!kind||!Number.isFinite(value)||value<=0)return;
  // Replace a prior feedback rather than stacking overlays or timers.
  clearTimeout(clear);clearTimeout(leave);
  document.getElementById('v156-feedback-layer')?.remove();
  const iso=String(tx?.currency||'DOP').toUpperCase();
  const code=iso==='USD'?'US$':'RD$';
  const formatted=new Intl.NumberFormat('es-DO',{minimumFractionDigits:2,maximumFractionDigits:2}).format(value);
  const layer=document.createElement('div');layer.id='v156-feedback-layer';layer.className='v156-feedback-layer';layer.dataset.kind=kind;layer.setAttribute('role','status');layer.setAttribute('aria-live','polite');layer.setAttribute('aria-atomic','true');
  const veil=document.createElement('div');veil.className='v156-feedback-veil';veil.setAttribute('aria-hidden','true');
  const panel=document.createElement('div');panel.className='v156-feedback-card';
  const glyph=document.createElement('div');glyph.className='v156-feedback-symbol';glyph.setAttribute('aria-hidden','true');glyph.innerHTML=symbols[kind];
  const title=document.createElement('div');title.className='v156-feedback-label';title.textContent=label[kind];
  const amount=document.createElement('div');amount.className='v156-feedback-amount';amount.textContent=prefix[kind]+' '+code+formatted;
  const text=document.createElement('div');text.className='v156-feedback-caption';text.textContent=subtitle[kind];
  panel.append(glyph,title,amount,text);layer.append(veil,panel);document.body.append(layer);
  // La confirmación animada sustituye al toast de éxito generado por el mismo guardado.
  const priorToast=document.getElementById('toast-root');if(priorToast?.querySelector('.toast'))priorToast.textContent='';
  // Haptics: never block saving when unavailable or disabled by system/browser.
  if(!window.matchMedia?.('(prefers-reduced-motion: reduce)').matches){
   window.v192HapticSuccess?.('transaction',false);
  }
  clear=setTimeout(()=>{layer.classList.add('v156-is-leaving');leave=setTimeout(()=>layer.remove(),350)},1550);
 }
 window.v156TransactionFeedback=feedback;
})();
</script>

<script id="vive-v177-eliminar-observaciones-visuales">
(function(){
  'use strict';
  /* Do not rewrite transaction notes, agreement concepts, or saved records. */
  const EXACT=/^observaciones(?:\s*[·•]\s*\d+|\s*\(\d+\)|\s+\d+)?$/i;
  const VISUAL_ITEMS='button,a,[role="tab"],[role="menuitem"]';
  const TOP_CHROME='nav,[role="tablist"],.topbar,.universe-switch-wrap,.universe-switch,.module-switch,.module-tabs,.v173-context-tabs,.v32-tool-bar,.v32-tool-actions,.v176-settings-jump,.v173-space-bottom,.v173-space-main,.v173-actions,.ff-dashboard-tools,.tab-nav,.tabs-nav,.nav-tabs,.subnav,.sub-menu';
  const TOP_ITEM_CLASSES='v173-tab,nav-btn,tab,tab-button,menu-item,submenu-item,subnav-item';
  const PROTECTED='form,[role="dialog"],.modal-layer,.modal,.v56-loan-list,.v56-panel,.v31-table-scroll,.table-wrap,.v31-world';
  const label=(el)=>String(el.textContent||'').replace(/[\u200b-\u200d\ufeff]/g,'').replace(/\s+/g,' ').replace(/[\s›»→↗]+$/g,'').trim();
  const isObservations=(el)=>EXACT.test(label(el))||EXACT.test(String(el.getAttribute('aria-label')||'').trim());
  function isTopItem(el){
    if(!el.closest('#app')||el.closest(PROTECTED))return false;
    if(el.closest(TOP_CHROME))return true;
    if(el.matches('.'+TOP_ITEM_CLASSES.split(',').join(',.')))return true;
    return false;
  }
  function pruneEmptyChrome(el){
    if(!el||!el.isConnected)return;
    if(!el.matches('nav,.v173-context-tabs,.v32-tool-actions,.universe-switch,.module-switch,.v176-settings-jump,.tab-nav,.tabs-nav,.nav-tabs,.subnav,.sub-menu'))return;
    if(el.children.length===0&&!el.textContent.trim())el.remove();
  }
  function clean(root){
    if(!root||!root.querySelectorAll)return;
    const chrome=root.querySelectorAll(VISUAL_ITEMS);
    for(const item of chrome){
      if(!isObservations(item)||!isTopItem(item))continue;
      const parent=item.parentElement;
      item.remove();
      pruneEmptyChrome(parent);
    }
    /* Entire top-level optional section, never a financial notes/records panel. */
    for(const el of root.querySelectorAll('#page > [aria-label],.main > [aria-label]')){
      if(!el.isConnected||!EXACT.test(String(el.getAttribute('aria-label')||'').trim()))continue;
      if(!el.matches('nav,[role="navigation"],[role="tablist"]'))continue;
      el.remove();
    }
  }
  function boot(){
    const root=document.getElementById('app');
    if(!root)return;
    let running=false;
    const flush=()=>{running=false;clean(root);};
    const observer=new MutationObserver(()=>{if(!running){running=true;queueMicrotask(flush);}});
    observer.observe(root,{childList:true,subtree:true});
    clean(root);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});
  else boot();
})();
</script>

<script id="vive-v184-sin-redundancias-js">
(()=>{
 const MONEY=/(?:RD\$|US\$)\s?\d[\d.,]*(?:\s?[KM])?/g;
 const CARD='.v58-metric,.v145-payment-kpi,.kpi';
 const HERO='.v58-main-value';
 const ACT='button,a[href],input,select,textarea,summary,[data-act],[role="button"],[tabindex]';
 const key=v=>v.replace(/\s+/g,'').toUpperCase();
 const real=v=>(v.match(/\d/g)||[]).length>=3&&!/^(RD\$|US\$)0[.,0]*$/.test(v);
 const open=e=>!e.closest('details:not([open])');
 const moneyOf=e=>[...new Set((e.textContent.match(MONEY)||[]).map(key).filter(real))];
 function tidy(){
  const page=document.getElementById('page');if(!page)return;

<script id="vive-v192-responsive-haptic">
(function(){
  'use strict';
  let lastPulse=0;
  const successVerb=/\b(?:registrad[oa]s?|guardad[oa]s?|confirmad[oa]s?|acreditad[oa]s?|contabilizad[oa]s?|vinculad[oa]s?|aplicad[oa]s?)\b/i;
  const financialNoun=/\b(?:movimiento|ingreso|gasto|transferencia|pago|préstamo|contacto|registro|categoría|subcategoría|beneficio|cashback|anualidad|cuenta|saldo|relación|abono|suscripción|certificado)\b/i;
  window.v192HapticSuccess=function(message,viaToast){
    const text=String(message||'');
    if(viaToast && (!successVerb.test(text)||!financialNoun.test(text)||/^(?:primero|no se|error|revisa|selecciona|introduce)/i.test(text)))return false;
    // Web Vibration API works on supporting Android browsers, not iOS Safari.
    if(typeof navigator.vibrate!=='function'||document.visibilityState!=='visible')return false;
    if(!window.matchMedia?.('(hover:none), (pointer:coarse)').matches && !(navigator.maxTouchPoints>0))return false;
    if(window.matchMedia?.('(prefers-reduced-motion:reduce)').matches)return false;
    const now=Date.now();if(now-lastPulse<650)return false;
    try{
      const didVibrate=navigator.vibrate(12); // one discreet 12 ms tap, no pattern
      if(didVibrate!==false){lastPulse=now;return true;}
    }catch(_){/* no hardware permission; saving continues normally */}
    return false;
  };

  let frame=0;
  function fitSummary(){
    const board=document.querySelector('.main.world-overview .ff-dashboard.summary-space');
    if(!board)return;
    board.style.removeProperty('zoom');
    board.style.removeProperty('width');
    board.style.removeProperty('max-width');
    const wide=window.matchMedia('(min-width:980px) and (min-height:660px)').matches;
    board.style.removeProperty('--v194-summary-height');
    board.style.removeProperty('height');
    board.style.removeProperty('min-height');
    board.style.removeProperty('overflow');
    if(!wide)return; // readable natural scroll on tablet and mobile
    const top=board.getBoundingClientRect().top;
    if(top<0)return;
    const space=Math.floor(window.innerHeight-top-14);
    // Never widen the page or distort circles; compute height from real remaining space.
    // For a very short viewport permit scrolling rather than clipping a financial figure.
    const available=Math.max(490,space),grid=board.querySelector('.ff-dashboard-grid.v105-grid');
    board.style.setProperty('height',available+'px','important');
    board.style.setProperty('min-height','0','important');
    board.style.setProperty('overflow','hidden','important');
    const summaryMain=board.closest('.main.world-overview');
    if(summaryMain){summaryMain.style.setProperty('height','100dvh','important');summaryMain.style.setProperty('min-height','0','important');summaryMain.style.setProperty('overflow-y','hidden','important');}
    board.style.setProperty('--v194-summary-height',available+'px');
    if(grid){
      grid.style.removeProperty('zoom');
      grid.style.removeProperty('width');
      grid.style.setProperty('height',Math.max(445,available-48)+'px','important');
      grid.style.setProperty('min-height','0','important');
      grid.style.setProperty('grid-template-rows','minmax(0,1.37fr) minmax(0,.96fr) minmax(0,1.03fr)','important');
      for(const child of grid.children)child.style.setProperty('min-height','0','important');
      // Mantener tipografía y controles a escala real (sin zoom global).
      grid.style.setProperty('zoom','1','important');
      grid.style.setProperty('width','100%','important');
    }
  }
  window.v192ScheduleSummaryFit=function(){
    cancelAnimationFrame(frame);
    frame=requestAnimationFrame(fitSummary);
  };
  window.addEventListener('resize',window.v192ScheduleSummaryFit,{passive:true});
  window.visualViewport?.addEventListener('resize',window.v192ScheduleSummaryFit,{passive:true});
  window.addEventListener('orientationchange',window.v192ScheduleSummaryFit,{passive:true});
  document.fonts?.ready?.then(window.v192ScheduleSummaryFit).catch(()=>{});
  window.v192ScheduleSummaryFit();
})();
</script>

<script id="vive-v279-wallet-carousel-stable">
/* Only the Wallet card rail is involved; no financial state is mutated here. */
(function(){
 'use strict';
 let activeRail=null,queue=false,scrollTimer=null,guardUntil=0;
 function faces(rail){return [...rail.querySelectorAll('.v266-wallet-face[data-id]')];}
 function centerTarget(rail,card){
   const r=rail.getBoundingClientRect(),c=card.getBoundingClientRect();
   const raw=rail.scrollLeft+(c.left-r.left)+(c.width-r.width)/2;
   return Math.max(0,Math.min(raw,rail.scrollWidth-rail.clientWidth));
 }
 function centerSelected(rail){
   if(!rail?.isConnected)return;
   const all=faces(rail),selected=all.find(c=>c.classList.contains('selected'))||all[0];
   if(!selected)return;
   const target=centerTarget(rail,selected);
   if(Math.abs(rail.scrollLeft-target)>1)rail.scrollLeft=target;
 }
 function findNearest(rail){
   const r=rail.getBoundingClientRect(),mid=r.left+r.width/2;
   return faces(rail).reduce((best,card)=>{
     const c=card.getBoundingClientRect(),distance=Math.abs(c.left+c.width/2-mid);
     return distance<best.distance?{distance,card}:best;
   },{distance:Infinity,card:null}).card;
 }
 function init(){
   const rail=document.querySelector('#page > .v279-wallet .v266-gallery-track');
   if(!rail||rail===activeRail)return;
   activeRail=rail;
   guardUntil=performance.now()+400;
   requestAnimationFrame(()=>centerSelected(rail));
   function settle(){
     if(!rail.isConnected||performance.now()<guardUntil)return;
     const candidate=findNearest(rail);
     if(candidate&&!candidate.classList.contains('selected')){
       guardUntil=performance.now()+450;
       candidate.click(); // Existing selection handler updates financial information.
     }
   }
   rail.addEventListener('scroll',()=>{clearTimeout(scrollTimer);scrollTimer=setTimeout(settle,180);},{passive:true});
   if('onscrollend' in rail)rail.addEventListener('scrollend',()=>{clearTimeout(scrollTimer);scrollTimer=setTimeout(settle,30);},{passive:true});
 }
 function schedule(){if(queue)return;queue=true;requestAnimationFrame(()=>{queue=false;init()});}
 function boot(){
   const app=document.getElementById('app');if(!app)return;
   new MutationObserver(schedule).observe(app,{subtree:true,childList:true});
   schedule();
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
})();
</script>

<script id="vive-v272-experiencia-accesible">
/* =============================================================================
   V272 — CAPA DE ACCESIBILIDAD Y CONTINUIDAD DE NAVEGACIÓN
   Complemento aislado: sin escrituras a db, persist, cálculos ni endpoints.
   ========================================================================== */
(function viveV272ExperienceLayer() {
  'use strict';

  const scope = '[data-v272-experience]';
  let lastModal = null;
  let lastFocusedElement = null;
  let activeModal = null;
  let activePageName = '';
  let scheduled = false;

  function visible(element) {
    if (!element || !element.isConnected) return false;
    if (element.hidden || element.closest('[hidden],[aria-hidden="true"]')) return false;
    const style = window.getComputedStyle(element);
    return style.display !== 'none' && style.visibility !== 'hidden';
  }

  function controls(root) {
    if (!root) return [];
    return [...root.querySelectorAll('button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])')]
      .filter(visible);
  }

  function ensureAnnouncementRegion() {
    let region = document.getElementById('v272-navigation-status');
    if (region) return region;
    region = document.createElement('div');
    region.id = 'v272-navigation-status';
    region.dataset.v272Experience = 'announcement';
    region.setAttribute('role', 'status');
    region.setAttribute('aria-live', 'polite');
    region.setAttribute('aria-atomic', 'true');
    Object.assign(region.style, {
      position: 'absolute', width: '1px', height: '1px', padding: '0', margin: '-1px',
      overflow: 'hidden', clip: 'rect(0, 0, 0, 0)', whiteSpace: 'nowrap', border: '0'
    });
    document.body.appendChild(region);
    return region;
  }

  function syncThemeWithSystemChrome() {
    const black = document.body.classList.contains('theme-black') ||
      document.body.classList.contains('theme-dark');
    const themeMeta = document.querySelector('meta[name="theme-color"]');
    const tone = black ? '#080d16' : '#f8f6fa';
    if (themeMeta && themeMeta.getAttribute('content') !== tone) {
      themeMeta.setAttribute('content', tone);
    }
    document.documentElement.style.colorScheme = black ? 'dark' : 'light';
  }

  function currentPageLabel() {
    const page = document.querySelector('#page');
    if (!page) return '';
    const title = page.querySelector('h1, h2, .top-title, .v266-wallet-header h1');
    return title?.textContent?.replace(/\s+/g, ' ').trim().slice(0, 100) || '';
  }

  function decorateIconButtons(root) {
    root.querySelectorAll('button').forEach(button => {
      if (button.hasAttribute('aria-label') || button.hasAttribute('title')) return;
      const text = button.textContent.trim();
      if (text && !/^[×✕+→‹›⌄⋯]$/.test(text)) return;
      const context = button.closest('.modal-head,.v266-wallet-header,.top-actions');
      const label = /modal-head/.test(context?.className || '') ? 'Cerrar ventana' :
        button.matches('[data-act="addCard"]') ? 'Agregar tarjeta' :
        button.matches('[data-act="closeModal"]') ? 'Cerrar ventana' :
        button.matches('[data-act="navigate"]') ? 'Ir a la sección' : null;
      if (label) button.setAttribute('aria-label', label);
    });
  }

  function decorateModal(modal) {
    if (!modal || !visible(modal)) return;
    if (!modal.getAttribute('role')) modal.setAttribute('role', 'dialog');
    if (!modal.getAttribute('aria-modal')) modal.setAttribute('aria-modal', 'true');
    const heading = modal.querySelector('.modal-head h2, .modal-head h3, h2');
    if (!modal.getAttribute('aria-label') && heading?.textContent?.trim()) {
      modal.setAttribute('aria-label', heading.textContent.trim());
    }
    const close = modal.querySelector('.modal-head .close, [data-act="closeModal"], .v259-close');
    if (close && !close.getAttribute('aria-label')) close.setAttribute('aria-label', 'Cerrar');
    if (close && !close.hasAttribute('type')) close.type = 'button';
  }

  function refreshModalState() {
    const modal = [...document.querySelectorAll('#modal-root .modal, #modal-root [role="dialog"]')]
      .filter(visible).pop() || null;
    if (modal === activeModal) return;
    if (modal) {
      if (!activeModal) lastFocusedElement = document.activeElement;
      decorateModal(modal);
      activeModal = modal;
      lastModal = modal;
      return;
    }
    if (activeModal) {
      activeModal = null;
      if (visible(lastFocusedElement) && typeof lastFocusedElement.focus === 'function') {
        lastFocusedElement.focus({ preventScroll: true });
      }
      lastFocusedElement = null;
    }
  }

  function refresh() {
    scheduled = false;
    ensureAnnouncementRegion();
    syncThemeWithSystemChrome();
    const page = document.getElementById('page');
    const modalRoot = document.getElementById('modal-root');
    if (page) decorateIconButtons(page);
    if (modalRoot) decorateIconButtons(modalRoot);
    refreshModalState();
    const label = currentPageLabel();
    if (label && label !== activePageName) {
      activePageName = label;
      ensureAnnouncementRegion().textContent = 'Sección: ' + label;
    }
  }

  function scheduleRefresh() {
    if (scheduled) return;
    scheduled = true;
    window.requestAnimationFrame(refresh);
  }

  document.addEventListener('keydown', event => {
    if (!activeModal || !activeModal.isConnected || !visible(activeModal)) return;
    if (event.key !== 'Tab') return;
    const items = controls(activeModal);
    if (!items.length) return;
    const first = items[0];
    const last = items[items.length - 1];
    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    }
  }, true);

  document.addEventListener('keydown', event => {
    if (event.key !== 'Escape' || event.defaultPrevented) return;
    const modal = document.querySelector('#modal-root .modal');
    if (!modal || !visible(modal)) return;
    const close = modal.querySelector('.modal-head .close,[data-act="closeModal"]');
    if (!close) return;
    event.preventDefault();
    close.click();
  });

  const observer = new MutationObserver(scheduleRefresh);
  function boot() {
    ensureAnnouncementRegion();
    const app = document.getElementById('app');
    const modalRoot = document.getElementById('modal-root');
    if (app) observer.observe(app, { childList: true, subtree: false });
    if (modalRoot) observer.observe(modalRoot, { childList: true, subtree: false });
    observer.observe(document.body, { attributes: true, attributeFilter: ['class'] });
    scheduleRefresh();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot, { once: true });
  } else {
    boot();
  }
})();
</script>
